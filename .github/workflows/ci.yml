name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://railcards:railcards_ci_password@localhost:5432/railcards?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-not-for-production-use-only
  JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-use-only
  COOKIE_SECRET: ci-cookie-secret-not-for-production-use-only
  NODE_ENV: test
  INVITE_ONLY_MODE: "true"
  API_PORT: "4000"
  WEB_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages and apps
        run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @railcards/database prisma:generate

      - name: Run unit tests
        run: pnpm test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railcards
          POSTGRES_PASSWORD: railcards_ci_password
          POSTGRES_DB: railcards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railcards -d railcards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @railcards/database prisma:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Seed catalog fixtures (rarities, series, cards, boosters, missions, demo/admin accounts)
        run: pnpm db:seed

      - name: Build API
        run: pnpm --filter @railcards/api build

      - name: Run integration tests against real PostgreSQL (auth, boosters, trades, market concurrency, admin permissions)
        run: pnpm --filter @railcards/api test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railcards
          POSTGRES_PASSWORD: railcards_ci_password
          POSTGRES_DB: railcards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railcards -d railcards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter @railcards/web exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @railcards/database prisma:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Seed catalog fixtures and demo/admin accounts (the E2E suite logs in as the seeded admin to mint an invitation code)
        run: pnpm db:seed

      - name: Build API and web app
        run: |
          pnpm --filter @railcards/api build
          pnpm --filter @railcards/web build

      - name: Start API in the background
        run: nohup node apps/api/dist/main.js > api.log 2>&1 &

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/v1/health && exit 0
            sleep 1
          done
          echo "API did not become healthy in time" && cat api.log && exit 1

      - name: "Run Playwright E2E tests (golden path: register, welcome bonus, booster, collection, market listing)"
        run: pnpm --filter @railcards/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
