name: railcards

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time — must point at the
        # PUBLIC api domain, not the internal "api" service name.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    # Domain (RailCards.fs0ciety.org) + HTTPS: assigned in the Coolify UI.
    # ALL Traefik routing is managed by Coolify — NO labels.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # The API's own PUBLIC base URL (no path suffix) — used to build
      # absolute links back to itself, e.g. uploaded image URLs.
      API_BASE_URL: ${API_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-railcards}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railcards}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Must be the PUBLIC web domain — the API's CORS + cookie config checks
      # the browser's Origin against this.
      WEB_BASE_URL: ${WEB_BASE_URL}
      INVITE_ONLY_MODE: ${INVITE_ONLY_MODE:-true}
      TRADE_CR_ENABLED: ${TRADE_CR_ENABLED:-true}
      MARKET_FEE_BPS: ${MARKET_FEE_BPS:-500}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-railcards-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-RailCards <no-reply@railcards.example>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      # Uploaded card/booster images (local-disk storage — see
      # apps/api/src/storage). Without this, every redeploy would wipe
      # them, since the container's own filesystem is ephemeral.
      - railcards_uploads_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Domain (single-level subdomain, e.g. railcards-api.fs0ciety.org — see
    # docs/deployment.md on why not a nested one) + HTTPS: assigned in the
    # Coolify UI. ALL Traefik routing is managed by Coolify — NO labels.

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-railcards}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railcards}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      # Waits on the api container's health check, i.e. on migrations
      # having already been applied (see apps/api/docker-entrypoint.sh).
      api:
        condition: service_healthy
    # Internal-only background worker — no public domain, no labels.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railcards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-railcards}
    expose:
      - "5432"
    volumes:
      - railcards_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railcards} -d ${POSTGRES_DB:-railcards}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal-only — never exposed publicly, no labels.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - railcards_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal-only — never exposed publicly, no labels.

volumes:
  railcards_postgres_data:
  railcards_redis_data:
  railcards_uploads_data:
